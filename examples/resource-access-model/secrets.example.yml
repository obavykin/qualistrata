access:
  ui:
    application:
      admin:
        username: demo-admin
        password: "<ui-admin-password>"

  unix:
    app-host:
      app-user:
        username: app
        password: "<app-ssh-password>"

    db-host:
      oracle-os-user:
        username: oracle
        password: "<oracle-ssh-password>"

  databases:
    main:
      app-db-user:
        username: app_schema
        password: "<database-password>"

  metrics:
    automation-metrics:
      writer:
        token: "<influx-write-token>"
